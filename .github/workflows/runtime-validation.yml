name: Native runtime acceptance

on:
  workflow_call:
    inputs:
      flutter-version:
        required: true
        type: string

permissions:
  contents: read

env:
  FLUTTER_SUPPRESS_ANALYTICS: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-2022
            device: windows
          - host: macos-15
            device: macos
    runs-on: ${{ matrix.host }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Exercise native reader, clipboard, Study, backup and offline restart
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/runtime-evidence
          flutter drive --driver=test_driver/platform_acceptance.dart --target=integration_test/platform_acceptance_test.dart -d '${{ matrix.device }}' 2>&1 | tee build/runtime-evidence/driver.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.device }}
          path: build/runtime-evidence
          if-no-files-found: warn
          retention-days: 30

  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: phone
            profile: pixel_2
          - shape: tablet
            profile: pixel_c
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true
      - name: Enable Android hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get --enforce-lockfile
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 2048M
          heap-size: 256M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/testing/run_android_acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-android-${{ matrix.shape }}
          path: build/runtime-evidence
          if-no-files-found: warn
          retention-days: 30

  ios:
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Boot available simulator and run native acceptance
        env:
          SIMULATOR_FAMILY: ${{ matrix.family }}
        run: python scripts/testing/run_ios_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.family }}
          path: build/runtime-evidence
          if-no-files-found: warn
          retention-days: 30
