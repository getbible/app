name: getbible_live
description: A local-first, cross-platform Flutter Bible reader powered by GetBible v3 Bible and Query services.
publish_to: none
version: 1.0.0-alpha.4+5

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.6'

dependencies:
  app_links: 7.2.2
  crypto: 3.0.7
  cupertino_icons: 2.0.0
  drift:
    git:
      url: https://github.com/simolus3/drift.git
      ref: 0936361b756809ccac7021c4663d1703885edc90
      path: drift
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router:
    git:
      url: https://github.com/flutter/packages.git
      ref: 40733ebc9869e44b626583abd11c549bff37d966
      path: packages/go_router
  http: 1.6.0
  intl: 0.20.2
  path_provider: 2.1.6
  provider: 6.1.5+1
  unorm_dart: 0.3.3
  url_launcher: 6.3.2
  uuid: 4.5.3

dependency_overrides:
  sqlite3:
    git:
      url: https://github.com/simolus3/sqlite3.dart.git
      ref: 660f9d4a766d3c8914884650fb27f21e08001130
      path: sqlite3

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Keep the existing default web UI font available without a Google CDN call.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
  assets:
    - assets/fonts/Roboto_LICENSE.txt
    - assets/branding/
    - assets/locales/
    - assets/native_locales/
