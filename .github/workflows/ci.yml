name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      web_base_href:
        description: 'Web hosting path (leading and trailing slash)'
        default: /flutter/
        type: string

env:
  FLUTTER_SUPPRESS_ANALYTICS: true

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      flutter: ${{ steps.sdk.outputs.version }}
      version_name: ${{ steps.version.outputs.version_name }}
      release_version: ${{ steps.version.outputs.release_version }}
      channel: ${{ steps.version.outputs.channel }}
      build_number: ${{ steps.version.outputs.build_number }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      web_base_href: ${{ steps.sdk.outputs.web_base_href }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: sdk
        env:
          WEB_BASE_HREF: ${{ inputs.web_base_href || '/flutter/' }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = pathlib.Path('.flutter-version').read_text().strip()
          base = os.environ['WEB_BASE_HREF']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid SDK pin'
          assert re.fullmatch(r'/(?:[A-Za-z0-9._~-]+/)*', base), 'Invalid web base path'
          assert not any(part in ('.', '..') for part in base.split('/')), 'Invalid web base segment'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nweb_base_href={base}\n')
          PY
      - id: version
        run: python scripts/release/package.py metadata --output build/release-metadata.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: build/release-metadata.json
          if-no-files-found: error
          retention-days: 90

  test:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: sha256sum -c assets/branding/BRAND_ASSETS.sha256
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-pub
      - run: python scripts/testing/embed_fixtures.py --check
      - run: flutter test --no-pub
      - name: Test developer and release tooling
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python -m unittest discover -s scripts/release/tests -p 'test_*.py'

  linux:
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true
      - name: Install native build and packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb dbus-x11 dpkg-dev desktop-file-utils xdg-utils
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: build
      - run: python scripts/develop.py check linux
      - run: flutter pub get --enforce-lockfile
      - name: Exercise native reader, migration, clipboard, Study and offline restart
        run: |
          set -o pipefail
          mkdir -p build/runtime-evidence
          xvfb-run -a dbus-run-session -- flutter drive --driver=test_driver/platform_acceptance.dart --target=integration_test/platform_acceptance_test.dart -d linux 2>&1 | tee build/runtime-evidence/driver.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-linux
          path: build/runtime-evidence
          if-no-files-found: warn
          retention-days: 30
      - run: flutter build linux --release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - run: python scripts/release/package.py package --target linux --metadata build/release-metadata.json --output dist --arch x64
      - name: Validate Debian installation and installed application startup
        run: |
          sudo apt-get install -y ./dist/*.deb
          desktop-file-validate /usr/share/applications/life.getbible.mobile.desktop
          test "$(xdg-mime query default x-scheme-handler/getbible)" = life.getbible.mobile.desktop
          xvfb-run -a python scripts/release/smoke_desktop.py /opt/getbible-live/getbible_life
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ needs.metadata.outputs.artifact_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  web:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
      WEB_BASE_HREF: ${{ needs.metadata.outputs.web_base_href }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/browser_smoke/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: build
      - run: flutter pub get --enforce-lockfile
      - run: dart compile js -O4 tool/drift_worker.dart -o web/drift_worker.dart.js
      - run: dart compile js -O2 tool/offline_bible_worker.dart -o web/offline_bible_worker.dart.js
      - run: flutter build web --release --no-web-resources-cdn --base-href "$WEB_BASE_HREF" --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - run: python scripts/build_web_shell.py --build-dir build/web
      - run: node --test tool/offline_shell/test.mjs
      - run: npm ci --prefix tool/browser_smoke
      - run: npx --prefix tool/browser_smoke playwright install --with-deps chromium firefox webkit
      - run: node --test tool/offline_shell/browser.test.mjs
      - name: Launch compiled app and verify persistence and offline installation in a real browser
        run: node tool/browser_smoke/run.mjs --build-dir build/web --base-path "$WEB_BASE_HREF" --browsers chromium,firefox,webkit
      - name: Record bounded live-service browser CORS evidence
        if: always()
        run: node tool/browser_smoke/probe-services.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostics-${{ needs.metadata.outputs.artifact_version }}
          path: build/browser-smoke
          if-no-files-found: ignore
      - run: python scripts/release/package.py package --target web --metadata build/release-metadata.json --output dist --base-href "$WEB_BASE_HREF"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-web-${{ needs.metadata.outputs.artifact_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  android:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ needs.metadata.outputs.release_version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: build
      - run: flutter pub get --enforce-lockfile
      # Android regenerates its plugin registrant during normal build setup.
      # Keep that setup when switching from debug (test plugins) to release.
      - run: flutter build apk --debug --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - run: flutter build apk --release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - run: flutter build appbundle --release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - run: python scripts/release/package.py package --target android --metadata build/release-metadata.json --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-android-${{ needs.metadata.outputs.artifact_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  windows:
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable long paths for pinned Flutter plugin sources
        run: git config --global core.longpaths true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: build
      - name: Install Windows installer compiler when absent
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --build-name "$env:VERSION_NAME" --build-number "$env:BUILD_NUMBER"
      - run: python scripts/release/package.py package --target windows --metadata build/release-metadata.json --output dist --arch x64
      - name: Install and launch the Windows package
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $destination = Join-Path $env:RUNNER_TEMP 'GetBible-Smoke'
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $registered = (Get-Item 'HKCU:\Software\Classes\getbible\shell\open\command').GetValue('')
          $expected = '"' + (Join-Path $destination 'getbible_life.exe') + '" "%1"'
          if ($registered -ne $expected) { throw "Incorrect getbible URI registration: $registered" }
          python scripts/release/smoke_desktop.py (Join-Path $destination 'getbible_life.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows-${{ needs.metadata.outputs.artifact_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  apple:
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 50
    env:
      VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    strategy:
      fail-fast: false
      matrix:
        target: [macos, ios-device, ios-simulator]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --find notarytool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: build
      - run: flutter pub get --enforce-lockfile
      - if: matrix.target == 'macos'
        run: flutter build macos --release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - if: matrix.target == 'ios-device'
        run: flutter build ios --release --no-codesign --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - if: matrix.target == 'ios-simulator'
        run: flutter build ios --simulator --debug --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - run: python scripts/release/package.py package --target '${{ matrix.target }}' --metadata build/release-metadata.json --output dist
      - if: matrix.target == 'macos'
        name: Inspect ZIP and install and launch the macOS DMG
        run: |
          mkdir "$RUNNER_TEMP/getbible-zip" "$RUNNER_TEMP/getbible-smoke" "$RUNNER_TEMP/getbible-dmg"
          ditto -x -k dist/*.app.zip "$RUNNER_TEMP/getbible-zip"
          test -x "$RUNNER_TEMP/getbible-zip/getBible.live.app/Contents/MacOS/getBible.live"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/getbible-dmg" dist/*.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/getbible-dmg"' EXIT
          ditto "$RUNNER_TEMP/getbible-dmg/getBible.live.app" "$RUNNER_TEMP/getbible-smoke/getBible.live.app"
          hdiutil detach "$RUNNER_TEMP/getbible-dmg"
          trap - EXIT
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$RUNNER_TEMP/getbible-smoke/getBible.live.app/Contents/Info.plist")" = getbible
          python scripts/release/smoke_desktop.py "$RUNNER_TEMP/getbible-smoke/getBible.live.app/Contents/MacOS/getBible.live"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}-${{ needs.metadata.outputs.artifact_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  signing:
    # No secret is exposed to pull-request code, including same-repository PRs.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: metadata
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.config.outputs.android_signing }}
      windows: ${{ steps.config.outputs.windows_signing }}
      macos: ${{ steps.config.outputs.macos_signing }}
      ios: ${{ steps.config.outputs.ios_signing }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          python scripts/release/signing_configuration.py --github-output > signing-status.json
          cat signing-status.json
          {
            echo '### Optional signed distributions'
            echo 'Missing configuration skips only that signed target. Unsigned test builds still run.'
            echo '```json'
            cat signing-status.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  android-signed:
    needs: [metadata, signing, test]
    if: needs.signing.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: build
      - run: flutter pub get --enforce-lockfile
      - name: Build signed Android release packages
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.metadata.outputs.release_version }}
          BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
        run: |
          python scripts/release/sign_android.py -- flutter build apk --release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
          python scripts/release/sign_android.py -- flutter build appbundle --release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - name: Verify signatures and package
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          python scripts/release/package.py package --target android-signed --metadata build/release-metadata.json --output dist --apksigner "$APKSIGNER"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-android-signed-${{ needs.metadata.outputs.artifact_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  windows-signed:
    needs: [metadata, signing, test]
    if: needs.signing.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable long paths for pinned Flutter plugin sources
        run: git config --global core.longpaths true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: build
      - name: Install Inno Setup when absent
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        env:
          VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
        run: flutter build windows --release --build-name "$env:VERSION_NAME" --build-number "$env:BUILD_NUMBER"
      - name: Sign staged executables and installer before checksums
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: python scripts/release/package.py package --target windows --metadata build/release-metadata.json --output dist --signing-mode distribution --sign-hook scripts/release/sign_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows-signed-${{ needs.metadata.outputs.artifact_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  macos-signed:
    needs: [metadata, signing, test]
    if: needs.signing.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --find notarytool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: build
      - run: flutter pub get --enforce-lockfile
      - name: Build macOS release
        env:
          VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
        run: flutter build macos --release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - name: Sign, notarize, staple and package macOS
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
        run: |
          bash scripts/release/sign_macos.sh app build/macos/Build/Products/Release/getBible.live.app
          python scripts/release/package.py package --target macos --metadata build/release-metadata.json --output dist --signing-mode distribution --sign-hook scripts/release/sign_macos_artifact.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos-signed-${{ needs.metadata.outputs.artifact_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  ios-signed:
    needs: [metadata, signing, test]
    if: needs.signing.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --find notarytool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: build
      - run: flutter pub get --enforce-lockfile
      - name: Build signed iOS App Store package
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
        run: bash scripts/release/sign_ios.sh
      - run: python scripts/release/package.py package --target ios-signed --metadata build/release-metadata.json --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-ios-signed-${{ needs.metadata.outputs.artifact_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90


  runtime-validation:
    needs: [metadata, test]
    uses: ./.github/workflows/runtime-validation.yml
    with:
      flutter-version: ${{ needs.metadata.outputs.flutter }}
